name: DB Schema Drift Detection

on:
  pull_request:
    branches: ["main", "develop"]
    paths:
      - 'supabase/migrations/**'
      - 'db/types.ts'
      - 'scripts/check-schema-drift.py'
      - 'scripts/generate-db-types.py'

jobs:
  schema-drift:
    name: Schema drift check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Check db/types.ts against supabase/migrations
        run: |
          python3 scripts/check-schema-drift.py
