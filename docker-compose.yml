# Local development stack: Postgres + agent + WhatsApp bot + frontend.
#
#   docker compose up            # everything
#   docker compose up postgres   # just the database
#
# See docs/LOCAL_DEV_STACK.md. Every secret below is a throwaway local-dev
# value; never reuse them outside this stack.

name: neurowealth

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: neurowealth
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once, on first start with an empty volume: a Supabase
      # compatibility shim, then every supabase/migrations/*.sql in order.
      - ./scripts/dev-stack/postgres-init:/docker-entrypoint-initdb.d:ro
      - ./supabase/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neurowealth"]
      interval: 5s
      timeout: 3s
      retries: 20

  agent:
    build:
      context: ./agent
    init: true
    # gracefulShutdown() allows 10 s to drain HTTP, finish the in-flight
    # event, flush the ledger cursor and close the pool.
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${AGENT_PORT:-3001}:3001"
    environment:
      PORT: "3001"
      NODE_ENV: development
      AGENT_EXECUTION_MODE: dry-run
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/neurowealth
      SOROBAN_RPC_URL: ${SOROBAN_RPC_URL:-https://soroban-testnet.stellar.org}
      SOROBAN_NETWORK_PASSPHRASE: ${SOROBAN_NETWORK_PASSPHRASE:-Test SDF Network ; September 2015}
      # Empty disables the event listener; set it to watch a deployed vault.
      VAULT_CONTRACT_ID: ${VAULT_CONTRACT_ID:-}
      OPENAI_API_KEYS: ${OPENAI_API_KEYS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}

  whatsapp:
    image: node:20-alpine
    working_dir: /app
    # --transpile-only: the package currently has pre-existing type errors
    # (vaultRouter.ts) that would stop a type-checking ts-node at boot.
    command: sh -c "npm ci --no-audit --no-fund && npx ts-node --transpile-only src/index.ts"
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${WHATSAPP_PORT:-3010}:3010"
    volumes:
      - ./whatsapp:/app
      - whatsapp_node_modules:/app/node_modules
    environment:
      PORT: "3010"
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/neurowealth
      ENCRYPTION_KEY: local-dev-only-encryption-key-0000000000
      PHONE_HASH_SALT: local-dev-only-phone-salt
      TWILIO_AUTH_TOKEN: local-dev-only-token
      # Lets you curl the webhook without a Twilio signature. Ignored when
      # NODE_ENV=production.
      TWILIO_SKIP_SIGNATURE_VALIDATION: "true"
      SOROBAN_RPC_URL: ${SOROBAN_RPC_URL:-https://soroban-testnet.stellar.org}
      # Required at boot; the placeholder makes portfolio reads fall back to zeros.
      VAULT_CONTRACT_ID: ${VAULT_CONTRACT_ID:-CPLACEHOLDER_SET_VAULT_CONTRACT_ID}

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SOROBAN_RPC_URL: ${SOROBAN_RPC_URL:-https://soroban-testnet.stellar.org}
      NEXT_PUBLIC_SOROBAN_NETWORK_PASSPHRASE: ${SOROBAN_NETWORK_PASSPHRASE:-Test SDF Network ; September 2015}
      NEXT_PUBLIC_VAULT_CONTRACT_ID: ${VAULT_CONTRACT_ID:-}
      # Auth/realtime features need a Supabase project (hosted or `supabase start`).
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}

volumes:
  postgres_data:
  whatsapp_node_modules:
  frontend_node_modules:
  frontend_next:
